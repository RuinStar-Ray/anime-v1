[project]
name = "anime-fortress"
version = "0.1.0"
description = "Automated, auditable anime publishing pipeline for Telegram channels"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.13,<3.14"
authors = [{ name = "Mad Demon" }]
dependencies = [
    "aiogram>=3.15,<4",
    "aiosqlite>=0.20,<1",
    "alembic>=1.14,<2",
    "defusedxml>=0.7.1,<1",
    "httpx>=0.28,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.6,<3",
    "python-dotenv>=1.0,<2",
    "SQLAlchemy>=2.0.36,<2.1",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.30,<1"]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "pytest-cov>=6,<8",
    "ruff>=0.9,<1",
]

[project.scripts]
anime-fortress = "anime_fortress.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anime_fortress"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning:aiosqlite.*"]
markers = ["integration: tests that execute real ffmpeg/ffprobe binaries"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "ASYNC"]
ignore = ["ASYNC240", "B008", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "ASYNC230"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.coverage.run]
source = ["anime_fortress"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
